name: Portfolio Health Check

on:
  push:
    branches:
      - main
    paths:
      - "**.html"
      - "data/**"
      - "portfolio_quality/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "assets/**"
      - "photos/**"
      - ".github/workflows/weekly-update.yml"
  pull_request:
    paths:
      - "**.html"
      - "data/**"
      - "portfolio_quality/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "assets/**"
      - "photos/**"
      - ".github/workflows/weekly-update.yml"
  schedule:
    # Every day at 9:13am Pacific (16:13 UTC)
    - cron: "13 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Test repository and deployed media
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run quality tests
        run: python3 -m unittest discover -s tests -v

      - name: Check local links and assets
        run: python3 scripts/check-refs.py

      - name: Check generated photo pages are current
        run: python3 scripts/render-photography.py --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Browser smoke test (every page, phone + desktop, key interactions)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tests/browser/smoke.js

      - name: Check production files
        id: static
        continue-on-error: true
        run: python3 scripts/check-site.py --root . --json-out reports/site-health-static.json

      - name: Probe external media
        id: live
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python3 scripts/check-site.py --root . --live --json-out reports/site-health-live.json

      - name: Upload health reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-health-report
          path: reports/site-health-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish health summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          reports = sorted(Path("reports").glob("site-health-*.json"))
          lines = ["## Portfolio health", ""]
          if not reports:
              lines.append("No health report was produced.")
          for report_path in reports:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              summary = report["summary"]
              lines.extend([
                  f"### {report_path.stem}",
                  "",
                  f"- Pages checked: {report['pages_checked']}",
                  f"- Broken: {summary['broken']}",
                  f"- Degraded: {summary['degraded']}",
                  f"- Unverifiable: {summary['unverifiable']}",
                  "",
              ])
              for finding in report["findings"][:25]:
                  lines.append(
                      f"- `{finding['severity']}` {finding['page']} — "
                      f"{finding['code']}: {finding['target']}"
                  )
              lines.append("")
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Enforce health result
        if: always()
        env:
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          if [ "$STATIC_OUTCOME" = "failure" ] || [ "$LIVE_OUTCOME" = "failure" ]; then
            echo "Portfolio health checks found critical failures."
            exit 1
          fi

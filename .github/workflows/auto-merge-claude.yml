name: Auto-Merge Claude Branch PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  auto-merge:
    name: Auto-merge if from claude/ branch
    runs-on: ubuntu-latest
    # Only same-repo branches named claude/* (never forks)
    if: startsWith(github.head_ref, 'claude/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # Passed through the environment, never pasted into the script, so a branch
      # name or PR title can't run as shell.
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BRANCH: ${{ github.head_ref }}

    steps:
      - name: Enable auto-merge
        run: |
          echo "Auto-merging PR #$PR_NUMBER from branch $PR_BRANCH"
          gh pr merge "$PR_NUMBER" \
            --squash \
            --auto \
            --subject "Auto-merge: $PR_TITLE" \
            --body "Auto-merged from branch $PR_BRANCH by the auto-merge workflow."

      - name: Post merge comment
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "Auto-merge enabled. This PR will merge automatically once checks pass."
        continue-on-error: true

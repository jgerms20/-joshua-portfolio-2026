name: Sync podcast episodes

# Pulls the newest episodes for each show (data/podcast-feeds.json) into
# data/episodes/<show>.json, and the network snapshot into data/network.json,
# which the podcast pages and /network/ read. Commits only when
# something changed, then starts a deploy so the new episodes go live.
on:
  schedule:
    # Every 6 hours, 30 minutes after the Curious & Creative network site
    # refreshes its own show data (it runs at :23 past every 6th hour).
    - cron: "53 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start a deploy; pushes made with GITHUB_TOKEN don't trigger one

concurrency:
  group: sync-episodes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest episodes
        env:
          # Optional: needed only for shows listed by spotify_show
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python3 scripts/sync-episodes.py

      - name: Fetch media diet (Letterboxd, Goodreads, Substack)
        run: python3 scripts/sync-media-diet.py

      - name: Commit changes and redeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain data/episodes data/network.json data/media-diet.json)" ]; then
            git config user.name "episode-sync"
            git config user.email "actions@users.noreply.github.com"
            git add data/episodes data/network.json data/media-diet.json
            git commit -m "Sync latest podcast episodes and media diet"
            git push
            gh workflow run deploy.yml --ref main
          else
            echo "No new episodes."
          fi

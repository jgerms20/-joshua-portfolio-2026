name: Sync podcast episodes

# Pulls the newest episodes for each show (data/podcast-feeds.json) into
# data/episodes/<show>.json, which the podcast pages read. Commits only when
# something changed, then starts a deploy so the new episodes go live.
on:
  schedule:
    # Every day at 7:07am Pacific (14:07 UTC)
    - cron: "7 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start a deploy; pushes made with GITHUB_TOKEN don't trigger one

concurrency:
  group: sync-episodes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest episodes
        env:
          # Optional: needed only for shows listed by spotify_show
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python3 scripts/sync-episodes.py

      - name: Commit changes and redeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain data/episodes)" ]; then
            git config user.name "episode-sync"
            git config user.email "actions@users.noreply.github.com"
            git add data/episodes
            git commit -m "Sync latest podcast episodes"
            git push
            gh workflow run deploy.yml --ref main
          else
            echo "No new episodes."
          fi
